# Встраиваемые в фасад КП50К двери и окна (каталог КП50К, "Встраиваемые конструкции").
# Ключ раздела = текст метки на слое "проемы" внутри ячейки (регистр не важен).
#
# Рама стоит в стойке вместо стекла:
#   от_оси           - край рамы, заходящий в стойку, от оси стойки/ригеля
#                      (СТ7116 - 12 мм, снято с сечения пользователя; зазор корпуса рамы до стойки 4 мм)
#   толщина_в_стойке - толщина части рамы, входящей в стойку; разницу с толщиной
#                      заполнения добирают доборником
#   ширина           - ширина профиля рамы в плоскости фасада (на чертеже)

["ДВЕРЬ СТ71"]
"название" = "Дверь СТ71, открывание наружу"
"рама" = "СТ7116"
"тип_рамы" = "Рама двери в фасад"
"ширина" = 78
"от_оси" = 12
"толщина_в_стойке" = 24
"уплотнитель" = "КПУ-268"
"винт" = "ВС 4,2х19 А2 DIN7981"
"стр" = 220
